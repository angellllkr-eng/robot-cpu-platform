name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Validate Python syntax
        run: |
          python -m compileall apps services packages

      - name: Run Python tests if present
        run: |
          if [ -d tests ]; then pytest -q; else echo "No Python tests configured"; fi

  frontend:
    name: Frontend validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/ak-precision-robotics/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install frontend dependencies
        working-directory: apps/ak-precision-robotics
        run: pnpm install --frozen-lockfile

      - name: Type-check frontend
        working-directory: apps/ak-precision-robotics
        run: pnpm check

      - name: Build frontend
        working-directory: apps/ak-precision-robotics
        run: pnpm build

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config --quiet
